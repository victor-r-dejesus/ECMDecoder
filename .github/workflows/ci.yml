name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build app and DMG
        run: scripts/build-app.sh "0.0.0-ci.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ECMDecoder-dmg
          path: build/*.dmg
          retention-days: 7
