name: Release

# Push a tag like v1.0.0 to build the DMG and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build app and DMG
        run: scripts/build-app.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.dmg \
            --title "ECMDecoder ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Download the DMG, open it and drag ECMDecoder to Applications. Requires macOS 12 or later (Apple silicon or Intel).

          The app is not notarized, so the first time you open it macOS will block it. Right-click (or Control-click) ECMDecoder in Applications, choose Open, then confirm. On macOS 15 and later, open System Settings → Privacy & Security and click Open Anyway."
